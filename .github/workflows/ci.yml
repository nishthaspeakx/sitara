# Sitara CI (playbook §1.5) — every PR green before merge, including Claude Code's own.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: lint · typecheck · build · token-lint · i18n-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm token-lint
      - run: pnpm i18n-lint

  design-system:
    # §24.8's design-QA gate + §14 Language QA. Separate job because it needs a
    # browser; the screenshot suite is release-blocking per §31.6, so it runs on
    # every PR rather than on demand.
    name: library contract · per-locale screenshot diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the design-system faces are vendored in the repo, so the baselines
      # rasterise the same here as they do locally — nothing is fetched
      - name: Install Playwright chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Library contract + CC-008 disclosure
        run: pnpm --filter web test
      - run: pnpm --filter web build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
      - name: Per-locale screenshot diff (49 × 4 locales × 2 themes)
        run: pnpm --filter web screenshots
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: apps/web/test-results/
          retention-days: 7

  py:
    name: ruff · pytest (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/schemas/python
          - services/api
          - services/realtime
          - services/astro
    # M1 auth tests run against real Mongo+Redis (same images as the dev stack).
    services:
      mongo:
        image: mongo:7
        ports: ["27018:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: ${{ matrix.package }}
      - run: |
          if [ -f pyproject.toml ] && grep -q ruff pyproject.toml; then uv run ruff check .; fi
        working-directory: ${{ matrix.package }}
      - run: uv run pytest -q
        working-directory: ${{ matrix.package }}

  schemas-drift:
    name: schemas codegen drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 packages/schemas/scripts/generate.py
      - run: git diff --exit-code -- packages/schemas

  golden-set:
    # RELEASE-BLOCKING (§5.5): parity gate arms on the first verified case;
    # structure tests run on every case regardless of status.
    name: golden-set (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/astro
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/golden tests/numerology -q -rs
      # Prints all three parity tables and FAILS the build below any threshold:
      # astrology ≥99.9%, numerology = 100%, panchang ≥99.9% (§5.5).
      # Each suite is dormant until its first verified case, then arms itself.
      - name: parity gate (§5.5)
        run: uv run python -m sitara_astro.golden report --gate
