[project]
name = "sitara-realtime"
version = "0.1.0"
description = "Sitara WebSocket chat/voice service (SPEC §6.1, §34.6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    # This service reaches the §9 pipeline over HTTP rather than holding one.
    "httpx>=0.27",
    "sitara-schemas",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "pyright>=1.1.380"]

[tool.uv.sources]
sitara-schemas = { path = "../../packages/schemas/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitara_realtime"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
