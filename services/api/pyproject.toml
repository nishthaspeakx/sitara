[project]
name = "sitara-api"
version = "0.1.0"
description = "Sitara FastAPI modular monolith (SPEC §6.3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sitara-schemas",
    "firebase-admin>=6.5",
    "motor>=3.6",
    "redis>=5.0",
    "httpx>=0.27",
    "pymongo[encryption]>=4.17.0",
    "anthropic>=0.121.0",
    "celery>=5.6.3",
    # M10. Declared rather than inherited from uvicorn[standard]: §25.3's live
    # call opens vendor websockets (Ink STT, Sonic TTS) and `httpx` does not
    # speak the protocol. It was already installed transitively, which is
    # exactly why it is written down — a dependency that arrives by accident
    # leaves by accident, and it would leave with the call path attached.
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7", "pyright>=1.1.380"]

[tool.uv.sources]
sitara-schemas = { path = "../../packages/schemas/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitara_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
