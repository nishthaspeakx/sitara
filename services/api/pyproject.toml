[project]
name = "sitara-api"
version = "0.1.0"
description = "Sitara FastAPI modular monolith (SPEC §6.3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "sitara-schemas",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "pyright>=1.1.380"]

[tool.uv.sources]
sitara-schemas = { path = "../../packages/schemas/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitara_api"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
