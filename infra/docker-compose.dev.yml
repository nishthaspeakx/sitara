# Sitara local dev stack (playbook Part 2: `docker compose -f infra/docker-compose.dev.yml up`)
# Build contexts are the repo root — services carry a path dep on packages/schemas/python.
name: sitara-dev

services:
  mongo:
    image: mongo:7
    ports:
      # Host port 27018 — a developer-machine mongod may own 27017; the stack
      # must never share a port with (or leak data into) unrelated local DBs.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # §23.3's email rung, locally. A REAL SMTP server — Mailpit accepts on 1025
  # and shows the inbox at http://localhost:8025 — so the adapter speaks the
  # same protocol it will speak to SES, and "did the brief go out" is a
  # question you answer by looking at a message rather than at a log line.
  #
  # No account, no verified sender, no sandbox to be let out of. Swapping in
  # SES is three environment variables (`NOTIFICATIONS_SMTP_HOST`, the
  # credentials) and no code — which is the whole reason `email` is IMPLEMENTED
  # in the capability matrix while `whatsapp` is DECLARED.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # 1025 SMTP (the API talks to this), 8025 the web inbox (you look at this).
      - "1025:1025"
      - "8025:8025"
    environment:
      # Kept in memory: a dev inbox that survives a restart is a dev inbox full
      # of yesterday's demo, and the §23.9 acceptance harness asserts against
      # what it just sent.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/sitara
      REDIS_URL: redis://redis:6379/0
      # §23.3's email rung. The container name is the host inside the network;
      # from the host machine it is localhost:1025 (the default in `config.py`).
      NOTIFICATIONS_SMTP_HOST: mailpit
      NOTIFICATIONS_SMTP_PORT: "1025"
      # §34.5 Admin-SDK verification — key stays out of the image (.dockerignore)
      # and is mounted read-only below.
      GOOGLE_APPLICATION_CREDENTIALS: .secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: sitara-f6063
    volumes:
      - ../services/api/.secrets:/app/services/api/.secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  astro:
    build:
      context: ..
      dockerfile: services/astro/Dockerfile
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # §6.1: "Celery + Celery Beat on Redis for schedules/queues". Beat and the
  # workers are separate containers because they scale on different axes and
  # fail differently: exactly ONE beat may run (two would double-fire every
  # §7.1 wave), while workers scale out freely.
  beat:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command:
      ["celery", "-A", "sitara_api.scheduling.celery_app:app", "beat", "--loglevel=info"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sitara
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # §7.1's generation queues, paying before trial (§23.7's per-class ordering
  # applies to the notification queues the delivery worker will own).
  worker-brief:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command:
      [
        "celery", "-A", "sitara_api.scheduling.celery_app:app", "worker",
        "-Q", "brief.paying,brief.trial", "--concurrency=2", "--loglevel=info",
      ]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sitara
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # §23.7's delivery queues, in T > D > C > M order. The `-Q` ordering is what
  # enforces the priority operationally; `celery_app.TASK_QUEUES` states the
  # same intent numerically, and both are written down so neither can drift
  # alone.
  #
  # Separate from worker-brief on purpose (§7.1's last box): a slow channel must
  # not back up brief COMPOSITION behind it. The wave writes rows; this drains
  # them.
  worker-notify:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command:
      [
        "celery", "-A", "sitara_api.scheduling.celery_app:app", "worker",
        "-Q", "notify.t,notify.d,notify.c,notify.m", "--concurrency=2",
        "--loglevel=info",
      ]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sitara
      REDIS_URL: redis://redis:6379/0
      NOTIFICATIONS_SMTP_HOST: mailpit
      NOTIFICATIONS_SMTP_PORT: "1025"
    volumes:
      # The VAPID keypair (§6.2). Read-only, and generated on the host by
      # `uv run python -m sitara_api.notifications.vapid --generate` — absent
      # is a valid state, and §23.3's ladder then delivers on email.
      - ../services/api/.secrets:/app/services/api/.secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # The tick itself, the panchang pre-job and the nightly memory consolidation.
  # Kept off the brief queues so a long consolidation cannot sit in front of
  # somebody's morning.
  worker-maintenance:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command:
      [
        "celery", "-A", "sitara_api.scheduling.celery_app:app", "worker",
        "-Q", "maintenance", "--concurrency=1", "--loglevel=info",
      ]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sitara
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
