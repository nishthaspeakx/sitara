[project]
name = "sitara-schemas"
version = "0.1.0"
description = "Sitara shared frozen contracts (SPEC §34.3/§34.4/§34.6) — generated, do not edit"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitara_schemas"]
